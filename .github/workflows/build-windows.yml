name: Build Shopee Live Monitor EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Tao file EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ShopeeLiveMonitor main.py

      - name: Luu file EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeLiveMonitor-Windows
          path: dist/ShopeeLiveMonitor.exe
